services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codelens
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: codelens
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codelens"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://codelens:local-demo-only@db:5432/codelens
      QUEUE_MODE: rq
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/projects')"]
      interval: 5s
      retries: 20
  worker:
    build: ./backend
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "--disable-job-desc-logging", "reviews"]
    environment: *backend_env
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      api: {condition: service_healthy}
    # Keep one worker: comparisons and inference run sequentially.
  web:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
